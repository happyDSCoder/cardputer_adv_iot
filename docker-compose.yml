services:
  tuya-daemon:
    build: .
    container_name: tuya_local_daemon
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config.json
    environment:
      - CONFIG_PATH=/app/config.json
      - CARDPUTER_HOST=192.168.178.180
    network_mode: host
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    network_mode: host
